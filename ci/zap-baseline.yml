name: ZAP DAST baseline

# Run on every push/PR to main, plus a weekly scheduled scan so the baseline
# keeps running even when the code is not changing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  issues: write  # the ZAP action opens/updates an issue summarising findings

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (fast gate before scanning)
        run: pytest -q

      - name: Start target app
        # Launch gunicorn in the background; the scan runs against this process.
        run: |
          gunicorn --bind 0.0.0.0:5000 app:app &
          # Block until the health probe answers so ZAP never races the boot.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/healthz && break
            sleep 1
          done

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5000/"
          rules_file_name: "rules.tsv"
          # -I: do not fail the step on WARN; the rules file marks the missing
          # security headers as FAIL, so only those break the build.
          cmd_options: "-I"
          allow_issue_writing: true
